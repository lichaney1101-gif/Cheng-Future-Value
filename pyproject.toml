[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheng-future-value"
version = "0.1.0"
description = "Bounded, cache-first NBA single-game ingestion"
requires-python = ">=3.12"
dependencies = ["nba_api==1.11.6", "requests==2.34.2", "duckdb==2.0.0", "pyarrow==26.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
